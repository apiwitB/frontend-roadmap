<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03-3 Grid</title>

  <!-- 🔒 ห้ามแก้ -->
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    section { margin-bottom: 40px; }
    .layout { width: 800px; max-width: 100%; min-height: 300px; }
    .layout > * { padding: 12px; border-radius: 6px; }
    .l-header { background: #fca5a5; }
    .l-sidebar { background: #fcd34d; }
    .l-main { background: #86efac; }
    .l-footer { background: #93c5fd; }
    .gallery { width: 640px; }
    .gallery > div { background: #c4b5fd; min-height: 100px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; }
  </style>

  <!-- ✏️ เขียนคำตอบที่นี่ -->
  <style id="student">
    /* ข้อ 1: .layout ใช้ grid-template-areas
       ┌──────────── header ────────────┐
       │ sidebar (200px) │ main (ที่เหลือ) │
       └──────────── footer ────────────┘
       ระยะห่าง 16px, main ต้องสูงยืดเต็มที่เหลือ (แถวกลาง = 1fr) */

    /* ข้อ 2: .gallery แต่ละช่องกว้างอย่างน้อย 150px และยืดให้เต็มแถว
              ให้จำนวนคอลัมน์ปรับเองอัตโนมัติ (ไม่ใช้ media query) ห่างกัน 12px */

    /* ข้อ 3: .featured กินพื้นที่ 2 คอลัมน์ × 2 แถว */

  </style>
</head>
<body>
  <section>
    <h2>ข้อ 1: Holy grail layout</h2>
    <div class="layout">
      <header class="l-header">Header</header>
      <aside class="l-sidebar">Sidebar</aside>
      <main class="l-main">Main</main>
      <footer class="l-footer">Footer</footer>
    </div>
  </section>

  <section>
    <h2>ข้อ 2–3: Gallery</h2>
    <div class="gallery">
      <div class="featured">★ 1</div>
      <div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div>
    </div>
  </section>

  <script src="../_shared/test-runner.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const R = (s) => (typeof s === 'string' ? $(s) : s).getBoundingClientRect();
    const near = (a, b, d = 1.5) => Math.abs(a - b) <= d;

    test('ข้อ 1: .layout เป็น grid', () => expect(getComputedStyle($('.layout')).display).toBe('grid'));
    test('ข้อ 1: header และ footer กว้างเต็ม', () => {
      const L = R('.layout');
      expect(near(R('.l-header').width, L.width) && near(R('.l-footer').width, L.width)).toBe(true);
    });
    test('ข้อ 1: sidebar กว้าง 200px อยู่ซ้ายของ main ในแถวเดียวกัน', () => {
      const s = R('.l-sidebar'), m = R('.l-main');
      expect(Math.round(s.width)).toBe(200);
      expect(near(s.top, m.top) && s.right < m.left).toBe(true);
    });
    test('ข้อ 1: ระยะห่าง 16px ทั้งแนวตั้งและแนวนอน', () => {
      expect(Math.round(R('.l-main').left - R('.l-sidebar').right)).toBe(16);
      expect(Math.round(R('.l-main').top - R('.l-header').bottom)).toBe(16);
    });
    test('ข้อ 1: ใช้ grid-template-areas', () => expect(getComputedStyle($('.layout')).gridTemplateAreas).not.toBe('none'));
    test('ข้อ 1: footer ติดขอบล่าง (แถวกลางยืด)', () => expect(near(R('.l-footer').bottom, R('.layout').bottom)).toBe(true));
    test('ข้อ 2: gallery มี 4 คอลัมน์ (เพราะกว้าง 640px)', () => {
      const cols = getComputedStyle($('.gallery')).gridTemplateColumns.split(' ').length;
      expect(cols).toBe(4);
    });
    test('ข้อ 2: ใช้ auto-fill/auto-fit (ลองเปลี่ยนกว้างแล้วคอลัมน์ต้องเปลี่ยนเอง)', () => {
      const g = $('.gallery');
      g.style.width = '400px';
      const cols = getComputedStyle(g).gridTemplateColumns.split(' ').length;
      g.style.width = '';
      expect(cols).toBe(2);
    });
    test('ข้อ 2: ห่างกัน 12px', () => expect(getComputedStyle($('.gallery')).columnGap).toBe('12px'));
    test('ข้อ 3: .featured กว้าง 2 คอลัมน์และสูง 2 แถว', () => {
      const items = [...$('.gallery').children].map(R);
      const f = items[0], one = items[1];
      expect(near(f.width, one.width * 2 + 12) ? 'ok' : `กว้าง ${Math.round(f.width)}px`).toBe('ok');
      expect(near(f.height, one.height * 2 + 12) ? 'ok' : `สูง ${Math.round(f.height)}px`).toBe('ok');
    });
  </script>
</body>
</html>
