<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06 Async</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.7; }
    code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px; }
    #demo { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; }
  </style>
</head>
<body>
  <h1>บทที่ 06: Async JavaScript</h1>
  <p>แก้ <code>06-async/exercise.js</code> แล้วรีเฟรช หลังทำข้อ 7 เสร็จ กดปุ่มข้างล่างดูผล และเปิดแท็บ Network ดูประกอบ</p>

  <div id="demo">
    <button id="load">โหลดผู้ใช้</button>
    <div id="out" aria-live="polite"></div>
  </div>

  <script src="../_shared/test-runner.js"></script>
  <script src="exercise.js"></script>
  <script src="tests.js"></script>
  <script>
    // ตัวอย่าง UI ที่มีครบ 3 สถานะ: loading / error / success
    document.getElementById('load').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = '⏳ กำลังโหลด…';
      try {
        const users = await loadUsersWithPosts();
        const ul = document.createElement('ul');
        users.forEach((u) => {
          const li = document.createElement('li');
          li.textContent = `${u.name} (${u.city}): ${u.posts.length} โพสต์`;
          ul.append(li);
        });
        out.replaceChildren(ul);
      } catch (e) {
        out.textContent = '❌ ' + e.message;
      }
    });
  </script>
</body>
</html>
