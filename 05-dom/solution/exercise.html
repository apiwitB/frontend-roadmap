<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 เฉลย</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; margin: 0; padding: 40px 16px; }
    .app { max-width: 480px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); overflow: hidden; }
    h1 { margin: 0; padding: 20px; font-size: 22px; border-bottom: 1px solid #e2e8f0; }
    form { display: flex; gap: 8px; padding: 16px 20px; }
    #todo-input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid #cbd5e1; border-radius: 8px; }
    form button { padding: 0 16px; font: inherit; background: #4f46e5; color: white; border: 0; border-radius: 8px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-top: 1px solid #f1f5f9; }
    li .text { flex: 1; overflow-wrap: anywhere; }
    li.done .text { text-decoration: line-through; color: #94a3b8; }
    li .delete { border: 0; background: none; color: #ef4444; cursor: pointer; font-size: 18px; opacity: .5; }
    li:hover .delete, li .delete:focus-visible { opacity: 1; }
    li .edit { flex: 1; font: inherit; padding: 4px 6px; }
    footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-top: 1px solid #e2e8f0; font-size: 14px; color: #64748b; }
    .filters { display: flex; gap: 4px; }
    .filters button { font: inherit; border: 1px solid transparent; background: none; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: inherit; }
    .filters button[aria-pressed="true"] { border-color: #4f46e5; color: #4f46e5; }
  </style>
</head>
<body>
  <main class="app">
    <h1>📝 Todo</h1>

    <form id="todo-form">
      <label for="todo-input" hidden>งานใหม่</label>
      <input id="todo-input" name="text" placeholder="ต้องทำอะไร?" autocomplete="off">
      <button type="submit">เพิ่ม</button>
    </form>

    <ul id="todo-list"></ul>

    <footer>
      <span id="todo-count" aria-live="polite"></span>
      <div class="filters" role="group" aria-label="กรอง">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
    </footer>
  </main>

  <!-- ต้นแบบของ todo 1 รายการ: ใช้ template.content.cloneNode(true) -->
  <template id="todo-template">
    <li class="todo">
      <input type="checkbox" class="toggle" aria-label="เสร็จแล้ว">
      <span class="text"></span>
      <button type="button" class="delete" aria-label="ลบ">✕</button>
    </li>
  </template>

  <script src="../../_shared/test-runner.js"></script>
  <script src="../tests.js"></script>   <!-- โหลดก่อน เพื่อแอบดูว่าติด event listener ที่ไหนบ้าง -->
  <script src="exercise.js"></script>
</body>
</html>
